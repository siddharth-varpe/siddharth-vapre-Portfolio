<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" fill="none">
  <defs>
    <!-- Ambient Blue Glow -->
    <radialGradient id="certGlow" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#60A5FA" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- Document Shadows -->
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <filter id="rosetteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>

    <!-- Certificate Document Gradients -->
    <linearGradient id="docGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="docGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Royal Blue Rosette Ribbon -->
    <linearGradient id="blueRosette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="ribbonTail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <rect x="10" y="5" width="180" height="130" rx="30" fill="url(#certGlow)" />

  <!-- Background Decorative Paper Sheet (Angled slightly) -->
  <g transform="rotate(-6 95 70)">
    <rect x="25" y="24" width="125" height="85" rx="8" fill="url(#docGradBack)" stroke="#CBD5E1" stroke-width="1.5" opacity="0.75" />
  </g>

  <!-- Foreground Main Certificate Sheet -->
  <g transform="rotate(4 105 70)" filter="url(#docShadow)">
    <rect x="35" y="22" width="125" height="88" rx="8" fill="url(#docGradFront)" stroke="#93C5FD" stroke-width="1.5" />
    <!-- Outer Certificate Border Inset -->
    <rect x="41" y="28" width="113" height="76" rx="4" fill="none" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3 2" />

    <!-- Certificate Top Header Line (Accent) -->
    <rect x="52" y="36" width="55" height="4" rx="2" fill="#3B82F6" />
    
    <!-- Stylized Text / Content Lines -->
    <rect x="52" y="46" width="76" height="2.5" rx="1.25" fill="#94A3B8" opacity="0.6" />
    <rect x="52" y="53" width="64" height="2" rx="1" fill="#CBD5E1" />
    <rect x="52" y="59" width="70" height="2" rx="1" fill="#CBD5E1" />
    <rect x="52" y="65" width="48" height="2" rx="1" fill="#CBD5E1" />

    <!-- Signature / Issuer Line -->
    <line x1="52" y1="84" x2="80" y2="84" stroke="#94A3B8" stroke-width="1" />
    <rect x="52" y="87" width="22" height="1.5" rx="0.75" fill="#CBD5E1" />

    <!-- Ribbon Tails (Underneath Rosette) -->
    <path d="M 124 74 L 118 96 L 126 92 L 132 95 L 127 74 Z" fill="url(#ribbonTail)" />
    <path d="M 132 74 L 138 96 L 132 92 L 126 95 L 129 74 Z" fill="url(#ribbonTail)" />

    <!-- Rosette Badge (Pointed / Pleated Edge) -->
    <g filter="url(#rosetteShadow)">
      <!-- 12-point star rosette base -->
      <path d="M 128 58 L 131 63 L 136 62 L 137 67 L 142 68 L 140 73 L 144 76 L 140 80 L 142 85 L 137 86 L 136 91 L 131 90 L 128 95 L 125 90 L 120 91 L 119 86 L 114 85 L 116 80 L 112 76 L 116 73 L 114 68 L 119 67 L 120 62 L 125 63 Z" fill="url(#blueRosette)" />
      <!-- Rosette Center Disk -->
      <circle cx="128" cy="76" r="11" fill="#1D4ED8" />
      <circle cx="128" cy="76" r="9.5" fill="url(#goldSeal)" />
      <!-- Star on Seal -->
      <path d="M 128 71.5 L 129.5 75 L 133 75.5 L 130.5 77.5 L 131.5 81 L 128 79 L 124.5 81 L 125.5 77.5 L 123 75.5 L 126.5 75 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Floating Sparkles / Diamonds -->
  <!-- Top Left Sparkle -->
  <path d="M 18 42 Q 18 50 12 50 Q 18 50 18 58 Q 18 50 24 50 Q 18 50 18 42 Z" fill="#60A5FA" />
  <!-- Accent Lines Burst (Left of cert) -->
  <line x1="20" y1="68" x2="28" y2="65" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="78" x2="26" y2="78" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="88" x2="28" y2="91" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom Right Mini Sparkle -->
  <path d="M 174 88 Q 174 94 169 94 Q 174 94 174 100 Q 174 94 179 94 Q 174 94 174 88 Z" fill="#FBBF24" />
</svg>
