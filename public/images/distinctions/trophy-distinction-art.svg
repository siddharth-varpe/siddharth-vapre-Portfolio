<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Background Aura Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#FACC15" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradients for Trophy Body -->
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cupInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="handleGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="handleGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="baseMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#64748B" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soft Ambient Sunburst / Aura -->
  <circle cx="106" cy="94" r="86" fill="url(#auraGlow)" />

  <!-- Sparkling Stars (Background & Foreground Accents) -->
  <!-- Sparkle 1 (Top Left) -->
  <path d="M 44 48 Q 44 60 32 60 Q 44 60 44 72 Q 44 60 56 60 Q 44 60 44 48 Z" fill="#FBBF24" filter="url(#glow)" />
  <!-- Sparkle 2 (Top Right Large) -->
  <path d="M 166 32 Q 166 48 150 48 Q 166 48 166 64 Q 166 48 182 48 Q 166 48 166 32 Z" fill="#F59E0B" filter="url(#glow)" />
  <!-- Sparkle 3 (Mid Left Small) -->
  <path d="M 28 98 Q 28 106 20 106 Q 28 106 28 114 Q 28 106 36 106 Q 28 106 28 98 Z" fill="#FDE047" />
  <!-- Sparkle 4 (Bottom Right Medium) -->
  <path d="M 172 120 Q 172 130 162 130 Q 172 130 172 140 Q 172 130 182 130 Q 172 130 172 120 Z" fill="#FBBF24" filter="url(#glow)" />

  <!-- Trophy Handles -->
  <!-- Left Handle Outer & Inner -->
  <path d="M 76 68 C 42 68 38 104 62 122 C 68 126 76 128 80 128 C 76 120 72 114 68 110 C 52 96 56 78 78 78 Z" fill="url(#handleGradLeft)" />
  <!-- Right Handle Outer & Inner -->
  <path d="M 136 68 C 170 68 174 104 150 122 C 144 126 136 128 132 128 C 136 120 140 114 144 110 C 160 96 156 78 134 78 Z" fill="url(#handleGradRight)" />

  <!-- Trophy Stem Connector -->
  <path d="M 98 136 L 114 136 L 112 154 L 100 154 Z" fill="url(#trophyGold)" />
  <!-- Trophy Stem Ring -->
  <ellipse cx="106" cy="154" rx="14" ry="4" fill="#F59E0B" />

  <!-- Pedestal Base Top Tier -->
  <path d="M 90 156 L 122 156 L 126 166 L 86 166 Z" fill="url(#trophyGold)" />
  <!-- Pedestal Base Column (Dark Slate-Gold Plinth) -->
  <rect x="80" y="166" width="52" height="18" rx="2" fill="url(#baseMetal)" />
  <!-- Base Plaque/Highlight Line -->
  <rect x="88" y="172" width="36" height="5" rx="1" fill="#FBBF24" opacity="0.85" />
  <!-- Pedestal Base Bottom Plate -->
  <rect x="74" y="184" width="64" height="6" rx="2" fill="#1E293B" />
  <rect x="76" y="184" width="60" height="1.5" fill="#94A3B8" />

  <!-- Trophy Cup Body -->
  <path d="M 72 60 C 72 108 92 136 106 136 C 120 136 140 108 140 60 Z" fill="url(#trophyGold)" />

  <!-- Cup Lip / Rim Depth -->
  <ellipse cx="106" cy="60" rx="34" ry="9" fill="url(#cupInner)" />
  <ellipse cx="106" cy="58" rx="34" ry="8" fill="url(#trophyGold)" />
  <ellipse cx="106" cy="58" rx="31" ry="5.5" fill="#FEF08A" opacity="0.6" />

  <!-- Cup Surface Specular Highlight -->
  <path d="M 80 64 C 80 94 92 118 100 128 C 94 116 86 92 86 64 Z" fill="url(#goldHighlight)" opacity="0.5" />

  <!-- Embossed Star on Cup Face -->
  <path d="M 106 82 L 109 91 L 118 91 L 111 96 L 113 105 L 106 100 L 99 105 L 101 96 L 94 91 L 103 91 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 106 85 L 108 91 L 114 91 L 109 95 L 111 101 L 106 97 L 101 101 L 103 95 L 98 91 L 104 91 Z" fill="#FDE68A" />
</svg>
