<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .mobile-handwritten {
        font-family: 'Caveat', 'Dancing Script', 'Segoe Script', cursive;
        font-weight: 700;
        font-size: 50px;
        fill: #475569;
        opacity: 0.85;
      }
      @media (prefers-color-scheme: dark) {
        .mobile-handwritten {
          fill: #94a3b8;
          opacity: 0.75;
        }
      }
    </style>
    <linearGradient id="planeBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="planeFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="planeUnderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Handwritten Text Stack -->
  <g transform="translate(15, 10)">
    <text x="50" y="52" class="mobile-handwritten" transform="rotate(-6, 50, 52)">Code</text>
    <text x="56" y="108" class="mobile-handwritten" transform="rotate(-5, 56, 108)">Create</text>
    <text x="64" y="164" class="mobile-handwritten" transform="rotate(-6, 64, 164)">Solve</text>
    <text x="72" y="220" class="mobile-handwritten" transform="rotate(-4, 72, 220)">Grow</text>
    
    <!-- Underline Swoosh -->
    <path
      d="M 90 230 C 125 222, 168 206, 215 186"
      stroke="#3b82f6"
      stroke-width="4.5"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>

  <!-- Curved Dashed Trajectory Arc -->
  <path
    d="M 120 280 C 150 270, 185 245, 205 210"
    stroke="#60a5fa"
    stroke-width="2.5"
    stroke-dasharray="6 6"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />

  <!-- 3D Origami Paper Airplane soaring up-right -->
  <g transform="translate(200, 180) rotate(-22)" filter="url(#softShadow)">
    <!-- Main Left Wing -->
    <polygon points="40,5 0,40 18,24" fill="url(#planeBodyGrad)" />
    <!-- Main Right Wing -->
    <polygon points="40,5 24,18 40,40" fill="url(#planeFoldGrad)" />
    <!-- Center Under-Keel -->
    <polygon points="40,5 18,24 24,18" fill="url(#planeUnderGrad)" opacity="0.9" />
  </g>
</svg>
