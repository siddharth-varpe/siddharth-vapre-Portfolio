<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.0" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#93c5fd" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.0" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Wave Layer 1 -->
  <path
    d="M 0 70 Q 250 20, 500 70 T 1000 70"
    stroke="url(#waveGrad1)"
    stroke-width="1.5"
    fill="none"
  />
  <!-- Wave Layer 2 -->
  <path
    d="M 0 85 Q 220 40, 480 80 T 1000 75"
    stroke="url(#waveGrad2)"
    stroke-width="1.2"
    fill="none"
  />
  <!-- Wave Layer 3 -->
  <path
    d="M 0 60 Q 280 15, 520 65 T 1000 60"
    stroke="url(#waveGrad3)"
    stroke-width="1"
    fill="none"
  />
  <!-- Wave Layer 4 - Micro sine detail -->
  <path
    d="M 100 78 Q 300 45, 500 72 T 900 68"
    stroke="url(#waveGrad1)"
    stroke-width="0.8"
    stroke-dasharray="2 3"
    fill="none"
  />

  <!-- Subtle glow node at center peak -->
  <circle cx="500" cy="70" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="500" cy="70" r="6" fill="#38bdf8" opacity="0.25" />
</svg>
